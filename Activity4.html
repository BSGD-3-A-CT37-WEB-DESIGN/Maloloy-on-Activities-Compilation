<!DOCTYPE html>
<html>

<head>
<title>My Playlist</title>
<link rel="icon" type="image/png" href="enhypensym.png">
<style>

@keyframes slide {
from { transform: translateX(300%); }
to { transform: translateX(-300%); }
}
.pagination {
margin-top: 20px;
display: flex;
gap: 10px;
}

.pagination a {
background-color: #ffbf00;
color: white;
padding: 8px 10px;
text-decoration: none;
border: 1px #ffbf00;
border-radius: 10px;
font-size: 12px;
color: white;
transition: background-color 0.3s;
}

.pagination a.active {
background-color: #ff5ce9;
border-color: #ff5ce9;
}

.pagination a:hover:not(.active) {
background-color: rgba(255, 191, 0, 0.3);
}

.playlist-link {
display: flex;
align-items: center;
width: fit-content;
text-decoration: none;
color: red;
font-size: 20px;
}

.playlist-link:hover {
text-decoration: underline;
}

.link-icon {
display: inline-block;
align-items: center;
justify-content: center;
width: 50px;
height: auto;
margin-right: 30px;
gap: 30px;
margin-top: 10px;

}


body{

background-image: url('enhypen.jpg');
background-repeat: no-repeat;
background-attachment: fixed;
background-size: cover;
margin: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;

}

h1{
white-space: nowrap;
animation: slide 10s infinite linear;
text-shadow: 0 0 10px black;
font-size: 50px;
color: orange;
}
 p {
font-size: 18px;
font-weight: 400;
color: #ffbf00;
}
p:hover{
color: yellow;
}
</style>
</head>

<body> 

<h1 id="movingTitle">@My Playlist</h1>
<p id="songTitle">ENHYPEN - Blossom</p>

<audio id="myAudio" controls>
  <source id="audioSource" src="BLOSSOM.mp3" type="audio/mpeg">
</audio>

<a href="https://www.youtube.com/playlist?list=PLDYUer4TOWn5tXAmUv3kbD-c2281kMFAj"target="_blank"class="playlist-link">
<img src="hee.gif" alt="icon" class="link-icon">
Enhypen Playlist
</a>

<div class="pagination">
<a href="#" onclick="moveSong(-1)">Previous</a>
    <a href="#" onclick="changeSong(0)">1</a>
    <a href="#" onclick="changeSong(1)">2</a>
    <a href="#" onclick="changeSong(2)">3</a>
    <a href="#" onclick="moveSong(1)">Next</a>
</div>

<script>
const songs = [
{ path: 'BLOSSOM.mp3', title: 'Enhypen - Blossom' },
{ path: 'SHOUT.mp3', title: 'Enhypen - Shout Out' },
{ path: '1009.mp3', title: 'Enhypen - Highway 1009' }
];
 let currentSongIndex = 0;
 function changeSong(index) {
 if (index < 0 || index >= songs.length) return;
currentSongIndex = index;
const song = songs[currentSongIndex];
const audio = document.getElementById('myAudio');
const source = document.getElementById('audioSource');
const titleDisplay = document.getElementById('songTitle');
source.src = song.path;
titleDisplay.innerHTML = song.title;
audio.load();
audio.play();
updatePaginationUI();
}
function moveSong(direction) {
let newIndex = currentSongIndex + direction;
if (newIndex >= songs.length) newIndex = 0;
if (newIndex < 0) newIndex = songs.length - 1;
changeSong(newIndex);
}
function updatePaginationUI() {
const links = document.querySelectorAll('.pagination a');
 links.forEach((link, idx) => {
  if (idx === currentSongIndex + 1) {
  link.classList.add('active');
 } 
  else {
link.classList.remove('active');
  }
});
}
</script>
</body>
</html>
